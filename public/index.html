<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Stock & Distribution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estate.css?v=1" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="10" ry="14" transform="rotate(30 16 16)" fill="currentColor"/><path d="M10 6c6 6 6 14 12 20" stroke="#fbf7f0" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-title" id="orgName">Coffee Stock</span>
        <span class="brand-sub">Godown stock &amp; distribution · Phase 1</span>
      </span>
    </a>
    <form class="scan-box" id="scanForm" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5v14M6 5v14M9 5v14M13 5v14M15 5v14M18 5v14M21 5v14" stroke="currentColor" stroke-width="1.6"/></svg>
      <input id="scanInput" type="text" placeholder="Scan or type package barcode…" aria-label="Scan or type package barcode" />
    </form>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">☰</button>
  </header>

  <div class="layout">
    <nav class="sidenav" id="sidenav" aria-label="Main">
      <a href="#/" data-nav="dashboard">Dashboard</a>
      <div class="nav-group">Stock</div>
      <a href="#/stock" data-nav="stock">Stock on hand</a>
      <a href="#/receive" data-nav="receive">Receive stock</a>
      <a href="#/transfer" data-nav="transfer">Transfer</a>
      <a href="#/adjust" data-nav="adjust">Adjustment</a>
      <a href="#/ledger" data-nav="ledger">Stock ledger</a>
      <div class="nav-group">Distribution</div>
      <a href="#/dispatch/new" data-nav="dispatch-new">New dispatch</a>
      <a href="#/dispatches" data-nav="dispatches">Dispatches</a>
      <a href="#/track" data-nav="track">Track barcode</a>
      <div class="nav-group">Setup</div>
      <a href="#/masters/godowns" data-nav="masters">Masters</a>
      <a href="#/settings" data-nav="settings">Settings &amp; backup</a>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="printRoot" class="print-root"></div>

  <script src="js/code128.js?v=1"></script>
  <script src="js/store.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
